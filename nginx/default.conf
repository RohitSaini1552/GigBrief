# NGINX reverse proxy for GigBrief
# Use this as a separate config file instead of editing app code.
# Copy it to /etc/nginx/conf.d/default.conf or mount it in Docker.

limit_req_zone $binary_remote_addr zone=gemini_limit:10m rate=3r/m;

upstream backend {
    server backend:5000;
}

server {
    listen 80;
    server_name localhost;
    limit_req_status 429;

    # Serve the built frontend from the mounted dist folder
    root /usr/share/nginx/html;
    index index.html;

    location = /api/generate {
        limit_req zone=gemini_limit nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        # Forward all API requests to the backend container
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # If route is not found, serve the frontend app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
